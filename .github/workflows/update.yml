name: Update modified Halo Android

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild the current upstream release with our latest fixes
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: modified-halo-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}

    steps:
      - uses: actions/checkout@v5

      - name: Check for a newer cybersecurity Android release
        id: probe
        run: python3 tools/update.py probe

      - uses: actions/setup-java@v5
        if: steps.probe.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        if: steps.probe.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build tools
        if: steps.probe.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build cmake ccache
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.2.9519653'

      - uses: actions/cache@v4
        if: steps.probe.outputs.build == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/ccache
          key: halo-android-${{ runner.os }}-${{ github.run_id }}
          restore-keys: halo-android-${{ runner.os }}-

      - name: Restore existing custom APK signing key
        if: steps.probe.outputs.build == 'true'
        env:
          BROWSER_KEYSTORE_BASE64: ${{ secrets.BROWSER_KEYSTORE_BASE64 }}
        run: |
          test -n "$BROWSER_KEYSTORE_BASE64" || {
            echo 'Add the existing browser signing key as an Actions secret.'
            exit 1
          }
          printf '%s' "$BROWSER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/browser.keystore"
          echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/browser.keystore" >> "$GITHUB_ENV"

      - name: Build modified APK
        if: steps.probe.outputs.build == 'true'
        id: build
        env:
          UPSTREAM_TAG: ${{ steps.probe.outputs.upstream }}
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BROWSER_KEYSTORE_PASSWORD }}
        run: python3 tools/update.py build

      - name: Publish phone update
        if: steps.probe.outputs.build == 'true'
        env:
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.probe.outputs.upstream }}
          FINGERPRINT: ${{ steps.probe.outputs.fingerprint }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          notes = (
              'Modified Halo CE Browser based on cybersecurity '
              + os.environ['UPSTREAM_TAG']
              + '.\n\nIncludes our in-game community browser and automatic lobby join.'
              + '\n\nBuild fingerprint: '
              + os.environ['FINGERPRINT']
              + '\n'
          )
          Path('release-notes.md').write_text(notes)
          PY

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/halo-browser.apk \
              dist/halo-android-browser.zip \
              upstream.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/halo-browser.apk \
              dist/halo-android-browser.zip \
              upstream.json \
              --draft \
              --title "Modified Halo $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --notes-file release-notes.md
